<div class="relative min-h-screen bg-bg flex items-center justify-center px-4 py-10 overflow-hidden">

  <!-- Fondo: resplandor dorado arriba y uno tenue abajo -->
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(55%_45%_at_50%_0%,rgba(242,194,0,0.16),transparent),radial-gradient(40%_35%_at_50%_100%,rgba(242,194,0,0.06),transparent)]"></div>

  <div class="relative w-full max-w-md nova-in">

    <!-- Logo con halo que "respira" -->
    <div class="relative flex justify-center mb-6">
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 sm:w-48 sm:h-48 rounded-full bg-brand/25 blur-3xl nova-glow"></div>
      <img src="assets/images/LogoNovaInns.png" alt="Nova Inns" class="relative w-44 h-44 sm:w-52 sm:h-52 object-contain drop-shadow-[0_10px_30px_rgba(0,0,0,0.6)]" />
    </div>

    <div class="text-center mb-6 space-y-1">
      <h1 class="text-2xl sm:text-3xl font-bold nova-gradient-text">Bienvenido de vuelta</h1>
      <p class="text-text-secondary text-sm">Entra para gestionar tus apartamentos</p>
    </div>

    <!-- Card -->
    <div class="nova-surface rounded-2xl overflow-hidden shadow-[0_24px_60px_-24px_rgba(0,0,0,0.8)]">
      <div class="h-1 bg-gradient-to-r from-brand-accent via-brand to-brand-pressed"></div>

      <form (ngSubmit)="submit()" #f="ngForm" novalidate class="p-6 sm:p-8">

        <!-- Email -->
        <div class="mb-5">
          <label for="login-email" class="block text-text-secondary text-sm mb-2">Correo electrónico</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 flex pointer-events-none text-text-disabled">
              <lucide-icon [img]="Mail" class="w-4.5 h-4.5" [strokeWidth]="2" />
            </span>
            <input
              id="login-email"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="tu@novainns.com"
              autocomplete="email"
              class="w-full bg-input border border-border rounded-xl pl-11 pr-4 py-3
                     text-text-primary placeholder:text-text-disabled transition-all
                     focus:outline-none focus:border-brand/60 focus:shadow-[0_0_0_4px_rgba(242,194,0,0.08)]"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="mb-7">
          <label for="login-password" class="block text-text-secondary text-sm mb-2">Contraseña</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 flex pointer-events-none text-text-disabled">
              <lucide-icon [img]="Lock" class="w-4.5 h-4.5" [strokeWidth]="2" />
            </span>
            <input
              id="login-password"
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full bg-input border border-border rounded-xl pl-11 pr-4 py-3
                     text-text-primary placeholder:text-text-disabled transition-all
                     focus:outline-none focus:border-brand/60 focus:shadow-[0_0_0_4px_rgba(242,194,0,0.08)]"
            />
          </div>
        </div>

        <!-- Error -->
        @if (error()) {
          <div class="bg-error/10 border border-error/30 rounded-xl px-4 py-3 mb-6 nova-in" role="alert">
            <p class="text-error text-sm">{{ error() }}</p>
          </div>
        }

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="group w-full flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-bg cursor-pointer
                 bg-gradient-to-r from-brand-accent to-brand transition-all
                 hover:shadow-[0_0_24px_rgba(242,194,0,0.45)] hover:-translate-y-px
                 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:shadow-none disabled:hover:translate-y-0"
        >
          @if (loading()) {
            <lucide-icon [img]="LoaderCircle" class="w-5 h-5 animate-spin" [strokeWidth]="2.2" />
            Ingresando...
          } @else {
            Ingresar
            <lucide-icon [img]="ArrowRight" class="w-5 h-5 transition-transform group-hover:translate-x-0.5" [strokeWidth]="2.2" />
          }
        </button>

      </form>
    </div>

    <p class="text-center text-text-disabled text-xs mt-6">
      Nova Inns Apartments &copy; {{ year }}
    </p>
  </div>
</div>
