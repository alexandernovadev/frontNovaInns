<div class="screen">
  <div class="glow" aria-hidden="true"></div>

  <div class="box">
    <!-- Logo con halo que respira -->
    <div class="logo-wrap">
      <div class="halo" aria-hidden="true"></div>
      <img src="assets/images/LogoNovaInns.png" alt="Nova Inns" class="logo" />
    </div>

    <header class="hello">
      <h1>Bienvenido de vuelta</h1>
      <p>Entra para gestionar tus apartamentos</p>
    </header>

    <form (ngSubmit)="submit()" #f="ngForm" novalidate class="card-form">
      <div class="field">
        <label for="login-email">Correo electrónico</label>
        <div class="with-icon">
          <lucide-icon [img]="Mail" [size]="18" [strokeWidth]="2" />
          <input id="login-email" type="email" [(ngModel)]="email" name="email" placeholder="tu@novainns.com" autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="login-password">Contraseña</label>
        <div class="with-icon">
          <lucide-icon [img]="Lock" [size]="18" [strokeWidth]="2" />
          <input id="login-password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      @if (error()) {
        <div class="error" role="alert">{{ error() }}</div>
      }

      <button type="submit" data-size="lg" data-block [attr.aria-busy]="loading() || null" [disabled]="loading()" class="go">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
        <lucide-icon [img]="ArrowRight" [size]="20" [strokeWidth]="2.4" />
      </button>
    </form>

    <p class="copy">Nova Inns Apartments &copy; {{ year }}</p>
  </div>
</div>
