<div class="shell">

  <!-- Overlay móvil -->
  @if (sidebarOpen()) {
    <div class="overlay" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="collapsed()" [class.open]="sidebarOpen()">
    @if (!collapsed()) {
      <div class="version">v{{ environmentService.version() }}</div>
    }
    <a routerLink="/bookings" aria-label="Nova Inns — ir a Reservas" class="brand">
      @if (collapsed()) {
        <img [src]="logo()" alt="Nova Inns" class="logo-mini" />
      }
      <img [src]="logo()" alt="Nova Inns" class="logo" />
    </a>

    <!-- Plegar (solo escritorio) -->
    <button (click)="toggleCollapsed()" class="collapse-btn" [class.flip]="collapsed()"
      [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Contraer menú'" [attr.title]="collapsed() ? 'Expandir menú' : 'Contraer menú'">
      <lucide-icon [img]="ChevronLeft" [size]="14" [strokeWidth]="2.4" />
    </button>

    <nav class="nav">
      @for (item of navItems(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeSidebar()" (mouseenter)="setTooltip(item.label, $event)" (mouseleave)="clearTooltip()"
          class="nav-item">
          <lucide-icon [img]="item.icon" [size]="20" [strokeWidth]="1.9" />
          <span class="label">{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (collapsed() && tooltip(); as t) {
      <div class="tooltip" [style.top.px]="t.top">{{ t.label }}</div>
    }

    <div class="foot">
      <button (click)="auth.logout()" (mouseenter)="setTooltip('Cerrar sesión', $event)" (mouseleave)="clearTooltip()" class="nav-item logout">
        <lucide-icon [img]="LogOut" [size]="20" [strokeWidth]="1.9" />
        <span class="label">Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <!-- Hamburguesa móvil: flota sobre el .page-header de cada página -->
    <button (click)="toggleSidebar()" title="Menú" aria-label="Menú" class="burger">
      <lucide-icon [img]="Menu" [size]="24" [strokeWidth]="2" />
    </button>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<alert-nova />
